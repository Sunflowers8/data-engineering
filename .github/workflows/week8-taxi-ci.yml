name: Week 8 Taxi App CI

on:
  push:
    paths:
      - "08-week-docker-cicd/taxi-app/**"
      - ".github/workflows/week8-taxi-ci.yml"
  pull_request:
    paths:
      - "08-week-docker-cicd/taxi-app/**"
      - ".github/workflows/week8-taxi-ci.yml"
  workflow_dispatch:

jobs:
  test-taxi-app:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 08-week-docker-cicd/taxi-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest -v test_app

      - name: Run application
        run: python app.py

      - name: Build Docker image
        run: docker build -t taxi-revenue:ci .

      - name: Run unit tests in Docker
        run: docker run --rm taxi-revenue:ci python -m unittest -v test_app

      - name: Run application in Docker
        run: docker run --rm taxi-revenue:ci
